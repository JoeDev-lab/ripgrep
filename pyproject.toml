[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greprag"
version = "1.0.0"
description = "Index-free, intent-driven lexical retrieval and MCP server for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GrepRAG Contributors" }
]
keywords = [
    "rag",
    "mcp",
    "ripgrep",
    "codebase-retrieval",
    "tree-sitter",
    "llm",
    "coding-agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "tree-sitter>=0.21.0",
    "mcp[cli]>=1.0.0"
]

[project.optional-dependencies]
# Language-specific tree-sitter packages
python = ["tree-sitter-python>=0.21.0"]
javascript = ["tree-sitter-javascript>=0.21.0"]
typescript = ["tree-sitter-typescript>=0.21.0"]
go = ["tree-sitter-go>=0.21.0"]
rust = ["tree-sitter-rust>=0.21.0"]
java = ["tree-sitter-java>=0.21.0"]
c-sharp = ["tree-sitter-c-sharp>=0.21.0"]
cpp = ["tree-sitter-cpp>=0.21.0"]
c = ["tree-sitter-c>=0.21.0"]
ruby = ["tree-sitter-ruby>=0.21.0"]
php = ["tree-sitter-php>=0.21.0"]

# Full language bundle
all-languages = [
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.21.0"
]

dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[project.scripts]
greprag-server = "greprag.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/greprag"
Repository = "https://github.com/yourusername/greprag.git"
Issues = "https://github.com/yourusername/greprag/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["greprag*"]