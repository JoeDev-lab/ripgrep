name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio responses

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop flake8 checking on first error
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit with non-zero if errors found
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=html --cov-report=term-missing
        # Check coverage threshold
        pytest --cov=src --cov-report=term-missing -k "not (test_async or test_memory_cleanup or test_parallel_ripgrep or test_many_files_same_dir or test_large_file or test_rapid_successive_calls or test_deeply_nested_structure)"

    - name: Test coverage report
      if: always()
      run: |
        echo "Coverage report available at: $GITHUB_WORKSPACE/coverage_html_report/index.html"
        # Check that coverage report was generated
        test -d coverage_html_report

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
